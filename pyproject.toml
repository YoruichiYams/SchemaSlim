[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "schemaslim"
version = "0.1.0"
description = "Lightweight local virtualizing reverse-proxy for Model Context Protocol (MCP) to solve Tool Explosion"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SchemaSlim Team" }
]
dependencies = [
    "mcp>=1.3.0",
    "pydantic>=2.7.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "fastembed>=0.4.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
schemaslim = "schemaslim.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["schemaslim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
